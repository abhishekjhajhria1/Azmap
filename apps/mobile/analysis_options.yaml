include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # The domain layer crosses a sync boundary; an unawaited write there is a
    # lost record, not a style question.
    unawaited_futures: error

linter:
  rules:
    # const everywhere it's possible: the survey ground and the dock rebuild on
    # every space change, and const constructors are what stop that cascading.
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    always_declare_return_types: true
    # Public API in lib/domain is the contract with the TypeScript side.
    public_member_api_docs: false
    avoid_print: true
