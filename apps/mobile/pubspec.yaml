name: abh
description: ABH — the roadmap, the map, and the people. Mobile.
publish_to: none
version: 0.1.0

environment:
  # 3.4 is the floor for the `switch` expressions and `final class` modifiers
  # used across lib/domain. Colour work uses withValues, which needs 3.27+.
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # Local-first storage. sqlite rather than a document store because the map is
  # a graph and edges want joins.
  sqlite3_flutter_libs: ^0.5.20
  drift: ^2.20.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # Sync: E2E-encrypted payloads, so the phone needs AES-GCM without a browser.
  cryptography: ^2.7.0
  http: ^1.2.2

  # Device identity for the merge tiebreak, persisted across launches.
  shared_preferences: ^2.3.2
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: false

  # The two families, one job each. Drop the files in before first build:
  #   fonts/Inter-Variable.ttf      https://rsms.me/inter/
  #   fonts/Fraunces-Variable.ttf   https://fonts.google.com/specimen/Fraunces
  # Until then Flutter falls back to the platform sans, which looks fine but
  # loses the serif voice that makes ABH recognisable.
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Variable.ttf
    - family: Fraunces
      fonts:
        - asset: fonts/Fraunces-Variable.ttf
