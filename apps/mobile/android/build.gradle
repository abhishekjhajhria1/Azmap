allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Flutter's standard shared-build-directory arrangement: every module writes
// under ../build so `flutter clean` has one place to delete.
rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
